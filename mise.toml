[tasks.frontend]
description = "Start frontend dev server (port 3000)"
run = "bun run --hot src/server.ts"

[tasks.backend]
description = "Start backend API server (port 3001)"
run = "bun run --hot src/server/index.ts"

[tasks.dev]
description = "Start both dev and backend servers"
depends = ["frontend", "backend"]

[tasks.build]
description = "Production build"
run = "bun run scripts/build.ts"

[tasks.test]
description = "Run unit tests"
run = "bun test src/__tests__/satellites.test.ts src/__tests__/flights.test.ts src/__tests__/stores.test.ts"

[tasks."test:all"]
description = "Run all tests including integration (requires server)"
run = "bun test"

[tasks."test:integration"]
description = "Run integration tests (requires server on port 3001)"
run = "bun test src/__tests__/integration.test.ts"

[tasks."test:watch"]
description = "Run unit tests in watch mode"
run = "bun test --watch src/__tests__/satellites.test.ts src/__tests__/flights.test.ts src/__tests__/stores.test.ts"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bunx tsc --noEmit"

[tasks.verify]
description = "Run full verification suite (typecheck + tests + build)"
depends = ["typecheck", "test", "build"]

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf dist node_modules/.cache"
